# Exemple Nginx reverse proxy (VPS) pour le jeu de l'oie + Socket.IO
# Remplacer oie.example.com et le port si besoin.

upstream oie_game {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name oie.example.com;

    # Rediriger vers HTTPS si certificats (Certbot) déjà en place :
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://oie_game;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (Socket.IO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}

# Avec HTTPS (après certbot --nginx -d oie.example.com), Certbot
# ajoutera le bloc listen 443 ssl automatiquement.
